# Zuhma Client Portal — stack de desarrollo local.
# Producción: en Easypanel se despliega 1 servicio por app (db gestionada aparte).
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: zuhma
      POSTGRES_PASSWORD: zuhma
      POSTGRES_DB: zuhma_portal
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zuhma -d zuhma_portal"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://zuhma:zuhma@db:5432/zuhma_portal
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    volumes:
      - ./backend:/app

  frontend:
    build: ./frontend
    env_file: .env
    ports:
      - "3000:3000"
    depends_on:
      - backend
    command: sh -c "npm run dev"
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  pgdata:
